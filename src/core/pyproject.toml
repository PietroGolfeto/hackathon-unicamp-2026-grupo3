[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enter-core"
version = "0.1.0"
description = "Contratos, política e parsing compartilhados entre api, model e extractor"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["core", "core.tests"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
