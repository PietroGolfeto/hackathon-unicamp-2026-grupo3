[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enter-api"
version = "0.1.0"
description = "API da política de acordos: FastAPI + SQLAlchemy 2 + Postgres 16"
requires-python = ">=3.12"
# enter-core é instalado antes, a partir de src/core (não está no PyPI).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "itsdangerous>=2.2",
  "bcrypt>=4.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
