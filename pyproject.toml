[project]
name = "enteros-acordos"
version = "0.1.0"
description = "Política de acordos do Banco Unicamp: engine de decisão por valor esperado, backtest reproduzível e API (Hackathon Enter/Unicamp 2026, Grupo 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "pyyaml>=6",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    # portal e contratos compartilhados (membros do workspace uv)
    "enter-core",
    "enter-api",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enteros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.uv]
# Índice público explícito: máquinas com espelho corporativo configurado falhariam no sync.
index-url = "https://pypi.org/simple"

[tool.uv.workspace]
members = ["src/core", "src/api"]

[tool.uv.sources]
enter-core = { workspace = true }
enter-api = { workspace = true }
