name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  higiene:
    name: higiene (commits, memory-bank, segredos)
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.detect.outputs.core }}
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      compose: ${{ steps.detect.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define intervalo de commits
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Mensagens e tamanho dos commits
        run: scripts/check_commits.sh "${{ steps.range.outputs.base }}" HEAD

      - name: Memory-bank atualizado em commits de código
        run: scripts/check_memory_bank.sh "${{ steps.range.outputs.base }}" HEAD

      - name: Segredos e dados versionados
        run: scripts/check_secrets.sh

      - name: Detecta componentes existentes
        id: detect
        run: |
          echo "core=$([ -f src/core/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "api=$({ [ -f src/api/pyproject.toml ] || [ -f src/api/requirements.txt ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f src/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "compose=$([ -f infra/compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  core:
    name: core (pytest)
    needs: higiene
    if: needs.higiene.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/core/pyproject.toml
      - name: Instala core com extras de teste
        run: pip install -e "src/core[test]"
      - name: Testes
        run: pytest src/core -q

  api:
    name: api (ruff + pytest com Postgres)
    needs: higiene
    if: needs.higiene.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enter
          POSTGRES_PASSWORD: enter
          POSTGRES_DB: enter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://enter:enter@localhost:5432/enter_test
      SECRET_KEY: ci-nao-usar-em-producao
      DEMO_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/core/pyproject.toml
            src/api/requirements.txt
      - name: Instala core, api e ferramentas
        run: |
          pip install -e src/core
          if [ -f src/api/requirements.txt ]; then pip install -r src/api/requirements.txt; else pip install -e src/api; fi
          pip install ruff pytest
      - name: Lint
        run: ruff check src/core src/api
      - name: Testes
        run: pytest src/api -q

  web:
    name: web (lint + build)
    needs: higiene
    if: needs.higiene.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  compose:
    name: compose (config válido)
    needs: higiene
    if: needs.higiene.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cria .env a partir do exemplo
        run: |
          if [ -f infra/.env.example ]; then cp infra/.env.example .env; elif [ -f .env.example ]; then cp .env.example .env; fi
      - name: Valida compose
        run: docker compose -f infra/compose.yml config -q
